packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@prisma/engines': true
  prisma: true
minimumReleaseAgeExclude:
  - fastify@5.12.1
# GHSA-ggr8-5vv4-36mx: deepmerge-ts <8.0.0 has stack exhaustion merging recursive object
# graphs. Pulled transitively via @prisma/config (prisma CLI's config loader) — Prisma has not
# yet released a version that bumps it, so pinned here until upstream catches up.
overrides:
  deepmerge-ts: ^8.0.0
